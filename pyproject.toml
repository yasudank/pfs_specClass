[project]
name = "pfs-specclass"
version = "0.1.0"
description = "Unsupervised classification and anomaly detection of Subaru/PFS spectra"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "astropy",
    "h5py",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "umap-learn",
    "hdbscan",
    "matplotlib",
    "tqdm",
    "torch",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pfs_specclass"]

[tool.uv]
link-mode = "copy"
